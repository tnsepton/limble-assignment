<div class="composer-container">
    <textarea #composer name="composer" class="composer"></textarea>
    <div class="button-container">
        <icon-button
            icon="send"
            (click)="addComment()"
        ></icon-button>
        <icon-button
            icon="x"
            (click)="closeComposer()"
        ></icon-button>
    </div>
</div>
