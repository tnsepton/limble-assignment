<form class="composer-container"
    (ngSubmit)="addComment($event);"
>
    <textarea #composer
        required
        name="comment"
        class="composer"
        [(ngModel)]="comment.body"
        (keypress)="handleKeypress($event)"
    ></textarea>
    <div class="button-container">
        <icon-button
            type="submit"
            icon="send"
        ></icon-button>
        <icon-button
            icon="x"
            (click)="closeComposer()"
        ></icon-button>
    </div>
</form>
