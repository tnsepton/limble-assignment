<form class="composer-container"
    (ngSubmit)="addComment($event);"
>
    <div #composer
        contenteditable
        class="composer"
        [textContent]="comment.body"
        (input)="handleInput($event)"
        (keydown)="handleKeydown($event)"
    ></div>
    <div class="tag-suggestions"
        *ngIf="tagSuggestions.length > 0"
    >
        <select-list
            title="Users"
            [options]="tagSuggestions"
            (onSelect)="tagUser($event)"
        ></select-list>
    </div>
    <div class="button-container">
        <icon-button
            type="submit"
            icon="send"
        ></icon-button>
        <icon-button
            icon="x"
            (click)="closeComposer()"
        ></icon-button>
    </div>
</form>
