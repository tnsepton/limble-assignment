<form class="composer-container"
    (ngSubmit)="addComment($event);"
>
    <div #composer
        contenteditable
        class="composer"
        [textContent]="comment.body"
        (input)="handleInput($event)"
    ></div>
    <select *ngIf="tagSuggestions.length > 0"
        name="tagging"
    >
        <option value="1">Kevin</option>
    </select>
    <div class="button-container">
        <icon-button
            type="submit"
            icon="send"
        ></icon-button>
        <icon-button
            icon="x"
            (click)="closeComposer()"
        ></icon-button>
    </div>
</form>
