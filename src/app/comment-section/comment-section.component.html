<div class="comment-section">
    <div class="comments-list">
        <h5>Comments:</h5>
        <app-comment
            *ngFor="let comment of comments; last as isLast"
            [comment]="comment"
            [isLast]="isLast"
        ></app-comment>
    </div>
    <div class="composer">
        <icon-text-button
            *ngIf="!commenting"
            icon="chatBubble"
            (click)="toggleCommentState()"
        >Add Comment</icon-text-button>
        <app-comment-composer
            *ngIf="commenting"
            [closeButton]="true"
            (onCloseEvent)="toggleCommentState()"
        ></app-comment-composer>
    </div>
</div>
