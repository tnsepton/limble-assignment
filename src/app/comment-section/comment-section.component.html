<div class="comment-section">
    <div class="comments-list">
        <h5>Comments:</h5>
        <app-comment
            *ngFor="let comment of comments; last as isLast"
            [comment]="comment"
            [isLast]="isLast"
        ></app-comment>
    </div>
    <div class="composer">
        <icon-button
            icon="chatBubble"
            text="Add Comment"
        ></icon-button>
    </div>
</div>
