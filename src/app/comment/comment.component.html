<div class="comment-container">
    <div class="body">
        <svg-icon icon="chatBubble"></svg-icon>
        <span>{{comment.body}}</span>
    </div>
    <div class="details">
        {{comment.author.name}} - {{comment.createdAt | date:'yyyy/MM/dd h:mm a' }}
    </div>
</div>
<hr *ngIf="!isLast">
